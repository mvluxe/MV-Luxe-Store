<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MV Luxe | Smart Living</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      letter-spacing: 3px;
    }

    header p {
      color: #d4af37;
      margin-top: 5px;
    }

    .hero {
      padding: 80px 20px;
      text-align: center;
      background: #222;
      color: white;
    }

    .hero h2 {
      font-size: 40px;
      margin-bottom: 15px;
    }

    .hero p {
      max-width: 600px;
      margin: auto;
      color: #ddd;
    }

    .shop-button {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 25px;
      background: #d4af37;
      color: #111;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
    }

    .section {
      max-width: 1000px;
      margin: auto;
      padding: 60px 20px;
      text-align: center;
    }

    .section h2 {
      margin-bottom: 15px;
    }

    .product {
      margin: 30px auto;
      max-width: 350px;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
    }

    .product h3 {
      margin-bottom: 10px;
    }

    .price {
      font-size: 24px;
      font-weight: bold;
      margin: 15px 0;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px;
    }
  </style>
</head>

<body>

<header>
  <h1>MV LUXE</h1>
  <p>Smart Living. Beautifully Simple.</p>
</header>

<section class="hero">
  <h2>Welcome
