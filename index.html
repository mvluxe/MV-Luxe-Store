<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MV Luxe</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f7f7f7;
  color: #222;
  text-align: center;
}

header {
  background: #111;
  color: white;
  padding: 25px 15px;
}

header h1 {
  margin: 0;
  letter-spacing: 3px;
}

header p {
  color: #d4af37;
}

.hero {
  background: #222;
  color: white;
  padding: 70px 20px;
}

.hero h2 {
  font-size: 38px;
}

.button {
  display: inline-block;
  background: #d4af37;
  color: #111;
  padding: 14px 25px;
  text-decoration: none;
  font-weight: bold;
  margin-top: 20px;
  border-radius: 5px;
}

.shop {
  padding: 50px 20px;
}

.product {
  background: white;
  max-width: 350px;
  margin: 25px auto;
  padding: 25px;
  border-radius: 10px;
}

.price {
  font-size: 25px;
  font-weight: bold;
}

footer {
  background: #111;
  color: white;
  padding: 20px;
}
</style>
</head>

<body>

<header>
  <h1>MV LUXE</h1>
  <p>Smart Living. Beautifully Simple.</p>
</header>

<section class="hero">
  <h2>Welcome to MV Luxe</h2>
  <p>Stylish and practical gadgets for modern living.</p>
  <a href="#shop" class="button">SHOP NOW</a>
</section>

<section class="shop" id="shop">
  <h2>Featured Product</h2>

  <div class="product">
    <h3>Electric Spin Scrubber</h3>
    <p>Make cleaning your bathroom and kitchen easier.</p>
    <p class="price">R449</p>
    <p>Coming soon to MV Luxe.</p>
  </div>
</section>

<footer>
  <p>© 2026 MV Luxe</p>
  <p>Smart Living. Beautifully Simple.</p>
</footer>

</body>
</html>
